<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yea Doc — Prototype</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat+Subrayada&display=swap" rel="stylesheet">
<style>
  :root { --cyan: #06b6d4; --violet: #8b5cf6; --surface: #121212; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #000; color: #fff; font-family: "Inter", system-ui, sans-serif; letter-spacing: .01em; -webkit-font-smoothing: antialiased; }
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px 16px; }
  .card {
    width: 100%; max-width: 420px; padding: 40px 32px 32px; border-radius: 16px; text-align: center;
    border: 2px solid transparent;
    background: linear-gradient(180deg, #121212 0%, #050505 100%) padding-box, linear-gradient(0deg, var(--cyan) 0%, var(--violet) 100%) border-box;
  }
  .logo { font-family: "Montserrat Subrayada", "Inter", sans-serif; font-size: 32px; margin: 0 0 8px; }
  .sub { margin: 0 0 32px; color: #b3b3b3; font-size: 16px; line-height: 1.5; }
  form { display: flex; flex-direction: column; gap: 14px; text-align: left; }
  label { font-size: 14px; color: #b3b3b3; }
  input {
    width: 100%; height: 56px; padding: 0 18px; border-radius: 40px; font: inherit; font-size: 16px; color: #fff;
    border: 2px solid transparent;
    background: linear-gradient(#000, #000) padding-box, linear-gradient(0deg, var(--cyan) 0%, var(--violet) 100%) border-box;
  }
  input:focus { outline: none; box-shadow: 0 0 0 3px rgba(6, 182, 212, .35); }
  input[aria-invalid="true"] { background: linear-gradient(#000, #000) padding-box, linear-gradient(#e5484d, #e5484d) border-box; }
  button {
    height: 52px; border: 0; border-radius: 8px; background: var(--cyan); color: #000;
    font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 6px;
  }
  button:hover, button:focus-visible { background: #22d3ee; outline: none; }
  button[disabled] { opacity: .65; cursor: progress; }
  .msg { min-height: 21px; margin: 0; font-size: 14px; color: #ff8a8d; text-align: center; }
  .note { margin: 24px 0 0; font-size: 13px; color: #8a8a8a; }
</style>
</head>
<body>
  <main class="card">
    <h1 class="logo">Yea Doc</h1>
    <p class="sub">This prototype is private.<br>Enter the password to continue.</p>
    <form id="gate-form" novalidate>
      <label for="gate-pw">Password</label>
      <input id="gate-pw" type="password" autocomplete="current-password" required aria-describedby="gate-msg">
      <button id="gate-btn" type="submit">Enter Prototype</button>
      <p id="gate-msg" class="msg" role="status" aria-live="polite"></p>
    </form>
    <p class="note">Design prototype by Jairus Futrell</p>
  </main>
